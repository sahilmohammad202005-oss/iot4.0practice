<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IIoT & Industry 4.0 Quiz</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a237e 0%, #1565c0 100%);
    color: white;
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(21,101,192,0.3);
  }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .header p { font-size: 13px; opacity: 0.85; }

  .progress-wrap {
    background: rgba(255,255,255,0.25);
    border-radius: 6px;
    height: 8px;
    margin: 14px 0 6px;
  }
  .progress-bar {
    height: 8px;
    border-radius: 6px;
    background: #a5d6a7;
    transition: width 0.4s ease;
  }
  .progress-text { font-size: 12px; opacity: 0.9; }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: white;
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .stat-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-val { font-size: 26px; font-weight: 700; }
  .stat-val.correct { color: #2e7d32; }
  .stat-val.wrong   { color: #c62828; }
  .stat-val.score   { color: #1565c0; }
  .stat-val.remain  { color: #555; }

  /* Question card */
  .q-card {
    background: white;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .q-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: #e3f2fd;
    color: #1565c0;
  }
  .q-num { font-size: 13px; color: #888; margin-left: auto; }
  .q-text {
    font-size: 16px;
    line-height: 1.7;
    color: #1a1a1a;
    font-weight: 500;
    margin-bottom: 20px;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    text-align: left;
    background: #f8f9fa;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .opt-btn:hover:not(:disabled) {
    background: #e8f4fd;
    border-color: #90caf9;
  }
  .opt-btn:disabled { cursor: default; }
  .opt-label {
    font-weight: 700;
    min-width: 22px;
    color: #1565c0;
  }

  /* Answer states */
  .opt-btn.correct-ans {
    background: #e8f5e9;
    border: 2px solid #2e7d32;
    color: #1b5e20;
    animation: glowGreen 1.2s ease-in-out infinite alternate;
  }
  .opt-btn.wrong-ans {
    background: #ffebee;
    border: 2px solid #c62828;
    color: #b71c1c;
    animation: glowRed 1.2s ease-in-out infinite alternate;
  }
  .opt-btn.correct-ans .opt-label { color: #2e7d32; }
  .opt-btn.wrong-ans .opt-label   { color: #c62828; }

  @keyframes glowGreen {
    from { box-shadow: 0 0 0 0 rgba(46,125,50,0.2); }
    to   { box-shadow: 0 0 14px 4px rgba(46,125,50,0.4); }
  }
  @keyframes glowRed {
    from { box-shadow: 0 0 0 0 rgba(198,40,40,0.2); }
    to   { box-shadow: 0 0 14px 4px rgba(198,40,40,0.4); }
  }

  /* Explanation */
  .explanation {
    margin-top: 16px;
    background: #e3f2fd;
    border-left: 4px solid #1565c0;
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
    font-size: 13.5px;
    color: #1a2a4a;
    line-height: 1.6;
  }
  .explanation strong { color: #1565c0; }

  /* Navigation */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  .nav-btn {
    padding: 10px 24px;
    border-radius: 10px;
    border: 1.5px solid #ccc;
    background: white;
    color: #333;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn:hover:not(:disabled) { background: #f0f0f0; }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .nav-btn.primary {
    background: #1565c0;
    color: white;
    border-color: #1565c0;
  }
  .nav-btn.primary:hover:not(:disabled) { background: #1a237e; }
  .q-counter { font-size: 14px; color: #666; font-weight: 600; }

  /* Jump grid */
  .jump-section {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    margin-bottom: 20px;
  }
  .jump-section h3 {
    font-size: 13px;
    font-weight: 700;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .jump-grid {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    gap: 5px;
  }
  .jump-btn {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1.5px solid #e0e0e0;
    background: #f8f9fa;
    font-size: 10px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
  }
  .jump-btn:hover { border-color: #90caf9; background: #e3f2fd; color: #1565c0; }
  .jump-btn.answered-c { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; }
  .jump-btn.answered-w { background: #ffebee; border-color: #c62828; color: #c62828; }
  .jump-btn.current-q  { border: 2.5px solid #1565c0; background: #e3f2fd; color: #1565c0; }

  /* Result screen */
  .result-screen {
    background: white;
    border-radius: 16px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .result-screen h2 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .result-screen .sub { font-size: 15px; color: #666; margin-bottom: 10px; }
  .score-big { font-size: 64px; font-weight: 800; color: #1565c0; margin: 12px 0; line-height: 1; }
  .score-pct { font-size: 20px; color: #555; margin-bottom: 24px; }
  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* Assignment tabs */
  .assign-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .assign-tab {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid #e0e0e0;
    background: white;
    font-size: 12px;
    font-weight: 600;
    color: #666;
    cursor: pointer;
    transition: all 0.15s;
  }
  .assign-tab:hover { border-color: #90caf9; color: #1565c0; }
  .assign-tab.active { background: #1565c0; color: white; border-color: #1565c0; }

  @media (max-width: 520px) {
    .stats { grid-template-columns: repeat(2,1fr); }
    .jump-grid { grid-template-columns: repeat(10,1fr); }
    .result-stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const Q = [
{a:1,q:"Which of the following sensors is an example of a Zero Order System?",opts:["Thermometer","Potentiometer","Accelerometer","Gyroscope"],ans:1,exp:"A zero-order system produces an output that follows the input instantaneously without energy storage or dynamic lag. A potentiometer is a standard example of such a system."},
{a:1,q:"Which Zigbee device type acts as the root and also functions as the network bridge?",opts:["Zigbee Router","Zigbee End Device","Zigbee Coordinator","Zigbee Gateway"],ans:2,exp:"Every Zigbee network requires at least one coordinator, which initializes the network, acts as the root node, and serves as the network bridge."},
{a:1,q:"Which physical principle primarily explains the operation of hydraulic actuators?",opts:["Pascal's law","Bernoulli's principle","Ideal gas law","Faraday's law"],ans:0,exp:"Pascal's law states that pressure applied to a confined incompressible fluid is transmitted undiminished in all directions, enabling force multiplication and precise control in hydraulic systems."},
{a:1,q:"At which OSI layer does the 6LoWPAN protocol primarily operate to enable IPv6 packets over IEEE 802.15.4?",opts:["Physical Layer","Network Layer (Adaptation Layer)","Transport Layer","Application Layer"],ans:1,exp:"6LoWPAN introduces an adaptation layer between the MAC (link) layer and the network layer to support IPv6 header compression and packet fragmentation over IEEE 802.15.4 networks."},
{a:1,q:"Which IEEE 802.15.4 variant introduces Direct Sequence Ultra-Wideband (UWB) Physical Layer?",opts:["802.15.4a","802.15.4b","802.15.4e","802.15.4g"],ans:0,exp:"The IEEE 802.15.4a amendment specifies new physical layers, including Direct Sequence Ultra-Wideband (UWB), to support precise ranging and low-power communications."},
{a:1,q:"In the context of sensor characteristics, the properties of the system's transient response to an input are collectively termed as _____ characteristics.",opts:["Dynamic characteristics","Static characteristics","Time-domain characteristics","Steady-state characteristics"],ans:0,exp:"The transient response behavior of a sensing system is described using its dynamic characteristics."},
{a:1,q:"In the context of the WirelessHART standard (IEC 62591) operating in the 2.4 GHz ISM band, what is the frequency gap maintained between two adjacent channels?",opts:["2 MHz","5 MHz","20 MHz","25 MHz"],ans:1,exp:"WirelessHART follows IEEE 802.15.4 channelization in the 2.4 GHz ISM band, where a 5 MHz spacing between adjacent channels is maintained."},
{a:1,q:"State True or False. A Passive NFC device can neither transmit nor read any data.",opts:["True","False"],ans:1,exp:"A passive NFC device can transmit data when energized by an active NFC reader but cannot read data from other devices."},
{a:1,q:"What is the data rate of Bluetooth 2.0?",opts:["1 Mbps","2 Mbps","3 Mbps","4 Mbps"],ans:2,exp:"Bluetooth version 2.0 supports an enhanced data rate of up to 3 Mbps, whereas earlier versions support 1 Mbps."},
{a:1,q:"The primary focus of the ISA 100.11a technology is the implementation of _____ in the industrial environment.",opts:["Automation","Connectivity","Predictive maintenance","Security"],ans:0,exp:"ISA 100.11a is designed to support industrial automation using reliable and secure wireless communication."},
{a:1,q:"State True or False. Classical Internet is not meant for constrained IoT devices.",opts:["True","False"],ans:0,exp:"Classical Internet protocols are resource-intensive and unsuitable for constrained IoT devices without adaptations."},
{a:1,q:"In the context of CoRE Service Discovery, IoT devices register their resources to the Resource Directory (RD) using which interface?",opts:["Lookup Interface (LI)","Transport Interface (TI)","Registration Interface (RI)","Application Interface (AI)"],ans:2,exp:"IoT devices register their available resources with the Resource Directory using the Registration Interface (RI)."},
{a:1,q:"In the context of QoS for IoT Networks, which data timeliness policy mandates dropping stale data and notifying the application that a deadline has been missed?",opts:["Latency budget policy","Deadline policy","Retention policy","Priority policy"],ans:1,exp:"The Deadline policy enforces time constraints by dropping outdated data and notifying the application of missed deadlines."},
{a:1,q:"State True or False. MQTT works on the Request/Response framework on top of UDP.",opts:["True","False"],ans:1,exp:"MQTT uses a Publish/Subscribe communication model and operates over TCP/IP, not UDP."},
{a:1,q:"Which of the following is/are advantages of XMPP?",opts:["Interoperability","Extensibility","Flexibility","All of these"],ans:3,exp:"XMPP supports interoperability, extensibility, and flexibility, making it suitable for diverse IoT communication scenarios."},
{a:2,q:"Which type of waste in the Lean Production System is defined as \"Non value-added movement of people\"?",opts:["Transportation","Motion","Waiting","Defects"],ans:1,exp:"Motion refers to the non value-added movement of people, distinct from transportation which involves movement of materials."},
{a:2,q:"Which type of business model value proposition exists when a bunch of goods/services are of higher value compared to the individual value of that product?",opts:["Efficiency-centric","Novelty-centric","Lock-in centric","Complementary"],ans:3,exp:"Complementaries exist when a bundle of goods or services provides higher value than the sum of individual offerings."},
{a:2,q:"In the context of Lean Manufacturing wastes, what causes \"Processing waste\"?",opts:["Producing products before demand","Use of inappropriate tools for processing","Excess inventory on the factory floor","Non-value added movement of personnel"],ans:1,exp:"Processing waste arises from the use of inappropriate tools or methods that increase production cost without adding value."},
{a:2,q:"Which resource is primarily utilized to achieve \"Optimization\" in smart and connected products?",opts:["Optimization algorithms","Custom software","External data sources","Sensors only"],ans:0,exp:"Smart and connected products primarily utilize optimization algorithms as the key resource to achieve Optimization."},
{a:2,q:"Which specific \"New Material\" mentioned in the context of Physical Megatrends is described as being stronger than steel but thinner than a human hair?",opts:["Carbon Fiber","Graphene","Aerogel","Titanium Alloy"],ans:1,exp:"Graphene is described as stronger than steel while being thinner than the width of a human hair."},
{a:2,q:"What are the three types of work to be noticed when analyzing \"Value streams\"?",opts:["Design, Production, and Delivery","Value-added, Incidental, and Pure Waste","Manual, Automated, and Hybrid","Planning, Execution, and Monitoring"],ans:1,exp:"Value stream analysis identifies value-added, incidental, and pure waste work."},
{a:2,q:"What are the three categories of Megatrends driving the Fourth Industrial Revolution?",opts:["Economic, Social, Political","Physical, Digital, Biological","Hardware, Software, Network","Local, National, Global"],ans:1,exp:"Megatrends are classified into Physical, Digital, and Biological categories."},
{a:2,q:"Which material except Graphene is cited as an example of \"New Materials\" under Physical Megatrends?",opts:["Silicon","Thermoset plastics","Copper","Aluminum"],ans:1,exp:"Thermoset plastics along with Graphene is listed as an example of new materials under Physical Megatrends."},
{a:2,q:"How do you define Sustainability in the context of a Manufacturing Industry?",opts:["To increase profit margins annually","To continue at a fixed rate","To eliminate all waste products","To automate all processes"],ans:1,exp:"Sustainability is defined as the ability to continue at a fixed rate."},
{a:2,q:"In the context of \"Government Regulations,\" what does the acronym EPA stand for?",opts:["Economic Policy Agency","Environmental Protection Agencies","Energy Production Association","Employment Protection Act"],ans:1,exp:"EPA stands for Environmental Protection Agencies responsible for maintaining environmental rules."},
{a:2,q:"Which of the following is a characteristic of an economic depression?",opts:["Duration is less than a year","High employment rates","Exponential unemployment increase","Increase in available credit"],ans:2,exp:"Economic depression is characterized by an exponential increase in unemployment."},
{a:2,q:"Which layer in the architecture of smart and connected products is responsible for collecting and acquiring data?",opts:["Digital layer","Connectivity layer","Physical layer","Application layer"],ans:2,exp:"The Physical layer is responsible for collecting and acquiring data from objects or the environment."},
{a:2,q:"Which of the following is a \"Lock-in centric\" value creation model?",opts:["Focusing on novelty","Improving transaction efficiency","Preventing customer migration","Offering complementary products"],ans:2,exp:"Lock-in centric models focus on preventing customer migration."},
{a:2,q:"Which characteristic of smart factories involves \"Self-configuration\"?",opts:["Proactivity","Transparency","Agility","Connection"],ans:2,exp:"Self-configuration is listed as a key aspect of Agility in smart factories."},
{a:2,q:"In the automation pyramid of a smart factory, which level is at the very top?",opts:["Device level","Control level","Manufacturing execution system level","ERP level"],ans:3,exp:"The automation pyramid places the ERP level at the top."},
{a:3,q:"Who developed the first functioning Augmented Reality (AR) system in 1992?",opts:["Ivan Sutherland","Louis Rosenberg","Thamos Caudell","Morton Heilig"],ans:1,exp:"The timeline shows that Louis Rosenberg developed the first functioning AR system in 1992."},
{a:3,q:"In the 5C Architecture of CPS, which level provides the \"Collaborative Diagnostics\" functionality?",opts:["Cyber Level","Cognition Level","Configuration Level","Conversion Level"],ans:1,exp:"The Cognition level supports collaborative diagnostics and decision making."},
{a:3,q:"State True or False: AR technologies are widely used in the field of medical science to perform complex surgeries in the domain of Neurosurgery, MRI, and X-Ray systems.",opts:["True","False"],ans:0,exp:"AR technologies are widely applied in medical science for complex surgical procedures."},
{a:3,q:"Which \"V\" of Big Data refers to the fact that Big Data supports diverse categories and formats of data with no restrictions over input data formats?",opts:["Volume","Velocity","Variety","Value"],ans:2,exp:"Variety represents the heterogeneous nature and diversity of Big Data formats."},
{a:3,q:"In the context of Data Acquisition in Industry 4.0, what are the three main steps followed during the \"Data pre-processing\" of relational data?",opts:["Collection, Transmission, Storage","Integration, Clearing, Redundancy Mitigation","Analysis, Visualization, Decision Making","Encryption, Compression, Archiving"],ans:1,exp:"Relational data pre-processing involves integration, clearing, and redundancy mitigation."},
{a:3,q:"What is the first step involved in the working of a Virtual Reality (VR) system?",opts:["Display screen shows the user view through lenses","Processing unit creates sensations for the user","Lenses focus and reshape the image for each eye","Sensors estimate the user's motion and direction in space"],ans:3,exp:"The VR workflow begins with sensors estimating the user's motion and direction."},
{a:3,q:"State True or False: Brain-machine interfaces are engineered systems based on cognition and neuroscience and are a part of CPS.",opts:["True","False"],ans:0,exp:"Brain-machine interfaces are engineered systems based on cognition and neuroscience within CPS applications."},
{a:3,q:"What are PMUs in the context of CPS for Smart Grid?",opts:["Power Management Unit","Phasor Measurement Unit","Performance Monitoring Unit","Project Management Unit"],ans:1,exp:"PMUs measure synchronized voltage and current phasors in power grids."},
{a:3,q:"Which of the following options best describes a Collaboration Platform?",opts:["Manufacturing hardware device","Business networking software","Entertainment social app","Financial record database"],ans:1,exp:"Collaboration platforms combine organizational networking capabilities for operations."},
{a:3,q:"What are the five phases of the Product Lifecycle?",opts:["Plan, Do, Check, Act","Design, Build, Test, Deploy","Ideate, Create, Market, Sell","Visualize, Explain, Perceive, Retire"],ans:3,exp:"The product lifecycle consists of Visualize, Explain, Perceive, Use/Support, and Dispose/Retire phases."},
{a:3,q:"Which of the following is a Technique/Method proposed to refine production across the lifecycle?",opts:["ABC (Activity Based Costing)","XYZ Analysis","PQR Theory","LMN Modeling"],ans:0,exp:"ABC is listed as a method to refine production across the lifecycle."},
{a:3,q:"Which of the following best describes Artificial Intelligence (AI)?",opts:["Hardware manufacturing process","Manmade thinking power","Database management system","Manual data entry"],ans:1,exp:"AI is defined as manmade thinking power enabling intuitive decision-making."},
{a:3,q:"Declarative knowledge is also known as _____.",opts:["Operational knowledge","Heuristic knowledge","Relational knowledge","Procedural knowledge"],ans:2,exp:"Declarative knowledge is classified as relational knowledge."},
{a:3,q:"Which of the following is a usecase of AI in Industry 4.0?",opts:["Increasing manual labor","Reducing internet usage","Slowing production cycles","Ensuring machine safety"],ans:3,exp:"AI in Industry 4.0 is used to ensure machine safety and efficiency."},
{a:3,q:"Which of the following statement best describes the characteristics of Unstructured data?",opts:["Possesses pre-defined model","Stored in relational databases","Managed by SQL","No pre-defined model"],ans:3,exp:"Unstructured data does not possess any predefined model."},
{a:4,q:"Which component of Cybersecurity protects applications from outer threats, often using firewalls?",opts:["Application Security","Network Security","Cloud Security","End-user Education"],ans:0,exp:"Application security protects applications using software and hardware countermeasures such as firewalls."},
{a:4,q:"What is Zephyr?",opts:["A Smart Sensor","An Website","An OS","None of these"],ans:2,exp:"Zephyr is listed as a supporting operating system in the context of smart sensors."},
{a:4,q:"Most of the commonly used ransomware attacks use _____, where the user receives a legal file as an attachment and is skillfully forced to download or open it.",opts:["Worm","Virus","Trojan","Malware"],ans:2,exp:"Ransomware attacks commonly use Trojans delivered as legitimate-looking attachments."},
{a:4,q:"In the Software-Defined Cloud Manufacturing Architecture (SDCMA), which component is responsible for \"detecting abnormality\"?",opts:["Control Elements (CE)","Hardware Plane","Ensemble Intelligence Framework (EIF)","Software Plane"],ans:2,exp:"The Ensemble Intelligence Framework is responsible for detecting abnormalities in SDCMA."},
{a:4,q:"Typically, _____ form the core of the smart sensor nodes.",opts:["Transistors","Microprocessors","MOSFETS","Diodes"],ans:1,exp:"Microprocessors typically form the core of smart sensor nodes."},
{a:4,q:"Which cybersecurity component involves \"strategies to maintain the availability, integrity, and confidentiality of business data\"?",opts:["Network Security","Operational Security","Information Security","Physical Security"],ans:2,exp:"Information security focuses on protecting data using the CIA triad."},
{a:4,q:"Which of the following is NOT a protected asset in cybersecurity?",opts:["Hardware","Software","Data","Public domain information"],ans:3,exp:"Public domain information is not considered a protected cybersecurity asset."},
{a:4,q:"How does IIoT modify traditional automation techniques?",opts:["By removing all sensors","By exploiting IT technology","By using manual tools","By ignoring data"],ans:1,exp:"IIoT modifies traditional automation by exploiting information technology."},
{a:4,q:"Which of the following has been identified as a major challenge in IIoT deployment?",opts:["Excessive standardization","Lack of generated data","Surplus of skilled workers","Data integration challenges"],ans:3,exp:"Data integration is listed as a major challenge in IIoT deployment."},
{a:4,q:"How does Industrial Internet assist Power Production?",opts:["Increases inspection costs","Locates broken equipment easily","Disconnects the grid","Hides performance data"],ans:1,exp:"The Industrial Internet helps locate broken power equipment easily."},
{a:4,q:"State True or False: The Industrial Internet can benefit commercial aviation industries by improving both airline operations and asset management.",opts:["True","False"],ans:0,exp:"The Industrial Internet improves airline operations and asset management."},
{a:4,q:"What is considered the primary source of IIoT data?",opts:["Cloud Server","Actuator","Sensor","Microprocessor"],ans:2,exp:"Sensors are identified as the primary source of IIoT data."},
{a:4,q:"Conventional Sensing is primarily involved in _____.",opts:["Feedback automation","Cloud computing","Internet connectivity","Big data analytics"],ans:0,exp:"Conventional sensing is involved in feedback automation of industrial control systems."},
{a:4,q:"Which challenge of Industry 4.0 is directly associated with ageing society and lack of skilled workers?",opts:["Dynamic market conditions","Resource utilization","Constrained workforce","Product management"],ans:2,exp:"Ageing society and lack of skilled workers are categorized under constrained workforce."},
{a:4,q:"Efficient use of materials, water, and energy is categorized under which expected feature of Industry 4.0?",opts:["Competitiveness","Innovation","Workforce","Efficiency"],ans:3,exp:"Efficient resource usage is associated with the efficiency feature of Industry 4.0."},
{a:5,q:"In the context of the \"Value Proposition\" building block, which of the following is considered a qualitative value?",opts:["Price","Post-purchase cost reduction","Customer experience","Product performance"],ans:2,exp:"Customer experience is categorized as a qualitative value in the value proposition."},
{a:5,q:"A business model that serves specific and specialized customer groups is known as a:",opts:["Mass market","Segmented market","Niche market","Diversified market"],ans:2,exp:"Niche market business models focus on specific and specialized customer groups."},
{a:5,q:"Credits and cash owned by an organization are classified under which asset category?",opts:["Physical assets","Human assets","Intellectual assets","Financial assets"],ans:3,exp:"Financial assets include credits and cash owned by an organization."},
{a:5,q:"Which component of the IIoT business model focuses on solving the complexities and uncertainties inherent in interactions between various business actors?",opts:["Value Proposition","Value Network","Value Capturing","Value Communication"],ans:3,exp:"Value Communication addresses interaction complexities and uncertainties among IIoT stakeholders."},
{a:5,q:"In the context of Big Data generated by IIoT, which \"V\" refers to the trustworthiness or quality of the data?",opts:["Volume","Velocity","Variety","Veracity"],ans:3,exp:"Veracity refers to the trustworthiness and quality of data."},
{a:5,q:"Which of the following is considered a \"Lagging KPI\" for occupational safety?",opts:["Percentage of workers with adequate safety training","Number of OSH audits performed","Frequency of observed unsafe behavior","Number of production days lost due to sickness absence"],ans:3,exp:"Production days lost due to sickness absence is an outcome-based lagging indicator."},

let cur=0, chosen=new Array(Q.length).fill(-1);
const app=document.getElementById('app');

function getStats(){
  const answered=chosen.filter(x=>x!==-1).length;
  const corr=chosen.reduce((s,c,i)=>c===Q[i].ans?s+1:s,0);
  return {answered,corr,wrong:answered-corr,remain:Q.length-answered,pct:answered>0?Math.round((corr/answered)*100):0};
}

function render(){
  if(cur>=Q.length){renderResult();return;}
  const q=Q[cur],done=chosen[cur]!==-1,sel=chosen[cur];
  const s=getStats();
  const pct=Math.round((cur/Q.length)*100);

  const optsHTML=q.opts.map((o,i)=>{
    let cls='opt-btn';
    if(done){if(i===q.ans)cls+=' correct-ans';else if(i===sel&&sel!==q.ans)cls+=' wrong-ans';}
    const lbl=String.fromCharCode(65+i);
    return `<button class="${cls}" onclick="pick(${i})" ${done?'disabled':''}><span class="opt-label">${lbl}.</span>${o}</button>`;
  }).join('');

  let jumpHTML='<div class="jump-grid">';
  Q.forEach((_,i)=>{
    let cls='jump-btn';
    if(i===cur)cls+=' current-q';
    else if(chosen[i]!==-1)cls+=chosen[i]===Q[i].ans?' answered-c':' answered-w';
    jumpHTML+=`<button class="${cls}" onclick="goTo(${i})" title="Q${i+1}">${i+1}</button>`;
  });
  jumpHTML+='</div>';

  app.innerHTML=`
    <div class="header">
      <h1>IIoT &amp; Industry 4.0 Quiz</h1>
      <p>NPTEL — January–April 2026 &nbsp;|&nbsp; Assignments 1–12</p>
      <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="progress-text">${s.answered} answered &nbsp;·&nbsp; ${pct}% complete</div>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="stat-label">Correct</div><div class="stat-val correct">${s.corr}</div></div>
      <div class="stat-card"><div class="stat-label">Wrong</div><div class="stat-val wrong">${s.wrong}</div></div>
      <div class="stat-card"><div class="stat-label">Remaining</div><div class="stat-val remain">${s.remain}</div></div>
      <div class="stat-card"><div class="stat-label">Score</div><div class="stat-val score">${s.pct}%</div></div>
    </div>
    <div class="q-card">
      <div class="q-meta">
        <span class="badge">Assignment ${q.a}</span>
        <span class="q-num">Question ${cur+1} of ${Q.length}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optsHTML}</div>
      ${done?`<div class="explanation"><strong>✓ Explanation:</strong> ${q.exp}</div>`:''}
    </div>
    <div class="nav-row">
      <button class="nav-btn" onclick="goTo(cur-1)" ${cur===0?'disabled':''}>← Previous</button>
      <span class="q-counter">${cur+1} / ${Q.length}</span>
      ${cur<Q.length-1
        ?`<button class="nav-btn primary" onclick="goTo(cur+1)">Next →</button>`
        :`<button class="nav-btn primary" onclick="renderResult()">Finish Quiz ✓</button>`}
    </div>
    <div class="jump-section">
      <h3>Jump to question</h3>
      ${jumpHTML}
    </div>
  `;
}

function pick(i){
  if(chosen[cur]!==-1)return;
  chosen[cur]=i;
  render();
}

function goTo(i){
  if(i<0||i>=Q.length)return;
  cur=i;
  render();
}

function renderResult(){
  const s=getStats();
  const pct=Math.round((s.corr/Q.length)*100);
  const emoji=pct>=90?'🎉 Excellent!':pct>=70?'👍 Good job!':pct>=50?'📚 Keep going!':'💪 Keep practicing!';
  app.innerHTML=`
    <div class="header">
      <h1>IIoT &amp; Industry 4.0 Quiz</h1>
      <p>NPTEL — January–April 2026</p>
    </div>
    <div class="result-screen">
      <h2>Quiz Complete!</h2>
      <div class="sub">${emoji}</div>
      <div class="score-big">${s.corr}</div>
      <div class="score-pct">out of ${Q.length} &nbsp;·&nbsp; ${pct}%</div>
      <div class="result-stats">
        <div class="stat-card"><div class="stat-label">Correct</div><div class="stat-val correct">${s.corr}</div></div>
        <div class="stat-card"><div class="stat-label">Wrong</div><div class="stat-val wrong">${s.wrong}</div></div>
        <div class="stat-card"><div class="stat-label">Unanswered</div><div class="stat-val remain">${Q.length-s.answered}</div></div>
      </div>
      <div class="result-btns">
        <button class="nav-btn" onclick="restart()">🔄 Restart Quiz</button>
        <button class="nav-btn primary" onclick="reviewWrong()">📋 Review Wrong Answers</button>
      </div>
    </div>
  `;
}

function restart(){chosen=new Array(Q.length).fill(-1);cur=0;render();}
function reviewWrong(){
  const first=chosen.findIndex((c,i)=>c!==-1&&c!==Q[i].ans);
  if(first===-1){alert('No wrong answers to review! 🎉');return;}
  cur=first;render();
}

render();
</script>
</body>
</html>
